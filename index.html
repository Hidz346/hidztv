<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hidz | TV</title>
    <link rel="icon" type="image/png" href="https://www.gobox.my.id/file/IcHjU.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=VT323&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:       #050508;
            --surface:  #0e0e14;
            --surface2: #17171f;
            --pink:     #ff2d78;
            --cyan:     #00e5ff;
            --lime:     #b8ff00;
            --yellow:   #ffe000;
            --purple:   #bf00ff;
            --orange:   #ff6600;
            --white:    #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Space Mono', monospace;
            background: var(--bg);
            color: var(--white);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Y2K dot-grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 22px 22px;
            pointer-events: none;
            z-index: 0;
        }

        /* Subtle scanline overlay */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 3px,
                rgba(255,255,255,0.008) 3px,
                rgba(255,255,255,0.008) 4px
            );
            pointer-events: none;
            z-index: 9999;
        }

        h1, h2, h3, h4, h5 {
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 0.05em;
        }

        /* =====================
           NEOBRUTALISM UTILITIES
        ===================== */
        .brutal-shadow-pink  { box-shadow: 4px 4px 0 var(--pink); }
        .brutal-shadow-cyan  { box-shadow: 4px 4px 0 var(--cyan); }
        .brutal-shadow-lime  { box-shadow: 4px 4px 0 var(--lime); }
        .brutal-shadow-white { box-shadow: 4px 4px 0 var(--white); }

        /* Channel card — the core neobrutalist element */
        .channel-card {
            border: 2px solid rgba(255,255,255,0.12);
            box-shadow: 3px 3px 0 var(--pink);
            background: var(--surface);
            transition: border-color 0.12s ease, box-shadow 0.12s ease, transform 0.12s ease;
        }
        .channel-card:hover {
            border-color: rgba(255,255,255,0.75);
            box-shadow: 5px 5px 0 var(--cyan);
            transform: translate(-2px, -2px);
        }
        .channel-card:active {
            transform: translate(3px, 3px);
            box-shadow: 0px 0px 0 var(--cyan);
        }

        /* =====================
           BUTTONS
        ===================== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 2px solid var(--white);
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 10px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            padding: 10px 20px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            text-decoration: none;
            color: white;
            background: none;
        }
        .btn-pink {
            background: var(--pink);
            box-shadow: 4px 4px 0 var(--white);
        }
        .btn-pink:hover  { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--white); }
        .btn-pink:active { transform: translate(4px,4px);   box-shadow: 0   0   0 var(--white); }

        .btn-white {
            background: var(--white);
            color: #000;
            box-shadow: 4px 4px 0 var(--pink);
        }
        .btn-white:hover  { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--pink); }
        .btn-white:active { transform: translate(4px,4px);   box-shadow: 0   0   0 var(--pink); }

        .btn-dark {
            background: var(--surface2);
            border-color: rgba(255,255,255,0.25);
            box-shadow: 4px 4px 0 var(--cyan);
        }
        .btn-dark:hover  { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--cyan); }
        .btn-dark:active { transform: translate(4px,4px);   box-shadow: 0   0   0 var(--cyan); }

        /* =====================
           ANIMATIONS — Y2K
        ===================== */
        @keyframes marquee-scroll {
            from { transform: translateX(100%); }
            to   { transform: translateX(-100%); }
        }
        .marquee-inner { animation: marquee-scroll 22s linear infinite; white-space: nowrap; }

        @keyframes glitch {
            0%,100% { text-shadow: 2px 0 var(--pink), -2px 0 var(--cyan); }
            25%     { text-shadow: -2px 0 var(--pink), 2px 0 var(--cyan); }
            50%     { text-shadow: 2px 2px var(--pink), -2px -2px var(--cyan); }
            75%     { text-shadow: -2px 2px var(--pink), 2px -2px var(--cyan); }
        }
        .glitch { animation: glitch 3.5s ease-in-out infinite; }

        @keyframes live-pulse {
            0%,100% { transform: scale(1); opacity: 1; }
            50%     { transform: scale(1.5); opacity: 0.6; }
        }
        .live-dot {
            width: 7px; height: 7px;
            background: var(--lime);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--lime), 0 0 14px rgba(184,255,0,0.5);
            animation: live-pulse 1.5s ease-in-out infinite;
            display: inline-block;
            flex-shrink: 0;
        }

        /* Page fade-in */
        .animate-in {
            animation: fadeIn 0.4s cubic-bezier(0.22,1,0.36,1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* =====================
           NEON TEXT
        ===================== */
        .neon-pink   { color: var(--pink);   text-shadow: 0 0 8px var(--pink),   0 0 20px rgba(255,45,120,0.35); }
        .neon-cyan   { color: var(--cyan);   text-shadow: 0 0 8px var(--cyan),   0 0 20px rgba(0,229,255,0.35); }
        .neon-lime   { color: var(--lime);   text-shadow: 0 0 8px var(--lime),   0 0 20px rgba(184,255,0,0.35); }
        .neon-yellow { color: var(--yellow); text-shadow: 0 0 8px var(--yellow), 0 0 20px rgba(255,224,0,0.35); }

        /* =====================
           HEADER & NAV
        ===================== */
        header {
            background: var(--bg) !important;
            border-bottom: 2px solid var(--pink) !important;
        }
        nav {
            background: var(--bg) !important;
            border-top: 2px solid var(--cyan) !important;
        }

        /* Sticky player */
        .sticky-player {
            position: sticky;
            top: 3.5rem;
            z-index: 90;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }

        /* Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--pink); border-radius: 0; }

        /* =====================
           Y2K TICKER BAR
        ===================== */
        .ticker-bar {
            background: var(--pink);
            border-top: 2px solid white;
            border-bottom: 2px solid white;
            overflow: hidden;
            height: 28px;
            display: flex;
            align-items: center;
        }

        /* Accent bar (left side of section titles) */
        .section-accent-pink { width: 4px; height: 28px; background: var(--pink); flex-shrink: 0; }
        .section-accent-cyan { width: 4px; height: 28px; background: var(--cyan); flex-shrink: 0; }
        .section-accent-lime { width: 4px; height: 28px; background: var(--lime); flex-shrink: 0; }

        /* Content z-index */
        #main-content { position: relative; z-index: 1; }

        /* Status row in network panel */
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-family: 'VT323', monospace;
            font-size: 15px;
        }
        .status-row:last-child { border-bottom: none; }
    </style>
</head>
<body>

        <!-- Center: Y2K live badge (desktop) -->

        let CHANNELS = [];

        function initApp() {
            const counts = {};
            CHANNELS = RAW_CHANNELS.map((ch, index) => {
                counts[ch.name] = (counts[ch.name] || 0) + 1;
                const finalName = counts[ch.name] > 1 ? `${ch.name} ${counts[ch.name]}` : ch.name;

                    id: index,
                    displayName: finalName,
                    match: `${Math.floor(Math.random() * 15) + 85}%`,
                    rating: (Math.random() * 1.5 + 8).toFixed(1)

            });
            showPage('home');
            lucide.createIcons();
        }

                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/20"></div>

            navHome.style.filter = '';
            navDev.style.color   = '#4b5563';
            navDev.style.filter  = '';

            if (page === 'home' || page === 'watch') {
                navHome.style.color  = 'var(--pink)';
                navHome.style.filter = 'drop-shadow(0 0 6px var(--pink))';
            } else if (page === 'dev') {
                navDev.style.color  = 'var(--cyan)';
                navDev.style.filter = 'drop-shadow(0 0 6px var(--cyan))';
            }
        }

                                <div class="flex items-center gap-3 mt-3 mb-5" style="font-family:'VT323',monospace;font-size:16px">

                                        <div class="live-dot" style="width:5px;height:5px"></div>

                                        <h4 class="neon-cyan" style="font-family:'Bebas Neue',sans-serif;letter-spacing:0.15em;font-size:1.1rem">
                                            STATUS JARINGAN

                                    </div>
                                    <div class="status-row">
                                        <span class="text-white/40">STATUS</span>

                            </div>

                            <!-- MORE CHANNELS (horizontal scroll) -->

                                                    <div style="width:32px;height:32px;background:white;display:flex;align-items:center;justify-content:center">

                                                style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.12em">

                            </div>
                        </div>
                    </div>
                `;

                const video = document.getElementById('video-player');
                if (Hls.isSupported()) {
                    hlsInstance = new Hls();
                    hlsInstance.loadSource(ch.url);
                    hlsInstance.attachMedia(video);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.play().catch(function(e) { console.log("Auto-play blocked"); });
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = ch.url;
                    video.addEventListener('loadedmetadata', function() {
                        video.play().catch(function(e) { console.log("Auto-play blocked"); });
                    });
                }

                video.addEventListener('leavepictureinpicture', () => {
                    setTimeout(() => {
                        if (video.paused) {
                            video.play().catch(e => console.log("Gagal memutar ulang setelah PiP", e));

                    }, 100);

            /* ════════════════════════

                        <p class="mt-5 mb-10 tracking-widest neon-cyan" style="font-family:'VT323',monospace;font-size:1.3rem">

                                <div class="status-row">
                                    <span class="text-white/40">VERSION</span>
                                    <span class="neon-lime">v1.0 Edition</span>
                                </div>
                                <div class="status-row">
                                    <span class="text-white/40">TECH</span>
                                    <span class="neon-cyan">HLS.js + Adaptive</span>
                                </div>
                                <div class="status-row">
                                    <span class="text-white/40">QUALITY</span>
                                    <span class="neon-yellow">Ultra HD</span>
                                </div>
                                <div class="status-row">
                                    <span class="text-white/40">STATUS</span>
                                    <span class="neon-lime flex items-center gap-2">
                                        <div class="live-dot" style="width:5px;height:5px"></div>LIVE

                        <button onclick="showPage('home')" class="btn btn-white mx-auto">

                        <div class="mt-16 opacity-20 tracking-[0.5em]" style="font-family:'VT323',monospace;font-size:13px">

                        </div>
                    </div>
                `;
            }

            lucide.createIcons();
            window.scrollTo(0, 0);
        }

        async function togglePiP() {
            const video = document.getElementById('video-player');
            try {
                if (video !== document.pictureInPictureElement) {
                    await video.requestPictureInPicture();
                } else {
                    await document.exitPictureInPicture();
                }
            } catch (error) {
                console.error("Gagal mode PiP:", error);
            }
        }

        function toggleFullscreen() {
            const player = document.getElementById('video-player');
            if (player.requestFullscreen) player.requestFullscreen();
            else if (player.webkitRequestFullscreen) player.webkitRequestFullscreen();
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        }

        window.onload = initApp;
    </script>
