name: HIDZTV Live Channel Health

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production
        run: |
          set -e
          for i in $(seq 1 30); do
            code=$(curl -L -s -o /tmp/home.txt -w "%{http_code}" --max-time 15 https://hidztv-com.vercel.app/)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Test every catalogue channel
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          async function fetchJson(url) {
            const r = await fetch(url, { cache: 'no-store' });
            const body = await r.text();
            if (!r.ok) throw new Error('HTTP ' + r.status + ' from ' + url + ': ' + body.slice(0,300));
            return JSON.parse(body);
          }

          async function probe(url) {
            try {
              const r = await fetch(url, {
                headers: {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) HIDZTV-Health/1.0',
                  'Accept': '*/*'
                },
                redirect: 'follow',
              });
              const body = await r.text();
              const hls = r.ok && body.includes('#EXTM3U');
              return {
                url,
                status: r.status,
                ok: r.ok,
                hls,
                contentType: r.headers.get('content-type') || '',
                prefix: body.slice(0,160),
              };
            } catch (error) {
              return { url, status: 0, ok: false, hls: false, error: String(error) };
            }
          }

          async function main() {
            const catalogue = await fetchJson('https://hidztv-com.vercel.app/api/live-tv');
            const channels = catalogue.channels || [];
            const results = [];

            for (let offset = 0; offset < channels.length; offset += 6) {
              const batch = channels.slice(offset, offset + 6);
              const batchResults = await Promise.all(batch.map(async (channel) => {
                const sourceCandidates = [...new Set(
                  (channel.sources || []).filter(
                    (value) => typeof value === 'string' && value.includes('/api/live-tv/proxy?u=')
                  )
                )];

                const probes = await Promise.all(sourceCandidates.map(probe));
                const working = probes.find((item) => item.hls);

                return {
                  id: channel.id,
                  name: channel.name,
                  number: channel.number,
                  category: channel.category,
                  sourceCandidates,
                  working,
                  probes,
                };
              }));

              results.push(...batchResults);
              console.log('Checked', Math.min(offset + 6, channels.length), '/', channels.length);
            }

            const summary = {
              generatedAt: new Date().toISOString(),
              total: results.length,
              working: results.filter((item) => item.working).length,
              offline: results.filter((item) => !item.working).length,
              channels: results,
            };

            fs.writeFileSync('live-health.json', JSON.stringify(summary, null, 2));
            console.log(JSON.stringify({
              total: summary.total,
              working: summary.working,
              offline: summary.offline,
              workingChannels: results.filter((item) => item.working).map((item) => item.name),
              offlineChannels: results.filter((item) => !item.working).map((item) => item.name),
            }, null, 2));
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: hidztv-live-health
          path: live-health.json
