name: HIDZTV Live Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deployment
        run: |
          set -e
          for i in $(seq 1 30); do
            code=$(curl -L -s -o /tmp/home.txt -w "%{http_code}" --max-time 15 https://hidztv-com.vercel.app/)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Test working iNews upstream and HIDZTV proxy
        run: |
          node <<'NODE'
          const target = 'https://live.i-news.tv/hls/1/stream.m3u8';

          async function check(url) {
            const r = await fetch(url, {
              headers: {
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) HIDZTV-SmokeTest/1.0',
                'Accept': '*/*'
              },
              redirect: 'follow'
            });
            const body = await r.text();
            console.log(JSON.stringify({
              url,
              status: r.status,
              ok: r.ok,
              contentType: r.headers.get('content-type'),
              prefix: body.slice(0,300)
            }, null, 2));
          }

          (async()=>{
            await check(target);
            await check('https://hidztv-com.vercel.app/api/live-tv/proxy?u=' + encodeURIComponent(target));
          })().catch(e=>{ console.error(e); process.exit(1); });
          NODE
